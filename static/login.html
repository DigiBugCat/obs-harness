<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - OBS Harness</title>
    <style>
        :root {
            --bg-primary: #1a1a2e;
            --bg-secondary: #16213e;
            --bg-card: #0f3460;
            --text-primary: #eaeaea;
            --text-secondary: #a0a0a0;
            --accent: #9146ff;
            --accent-hover: #a970ff;
            --success: #4ecca3;
            --warning: #ffc107;
            --error: #e94560;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            max-width: 400px;
            width: 100%;
            padding: 2rem;
        }

        .card {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 2.5rem;
            text-align: center;
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            padding: 1rem 2rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            text-decoration: none;
            width: 100%;
        }

        .btn-twitch {
            background: var(--accent);
            color: white;
        }

        .btn-twitch:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }

        .twitch-logo {
            width: 24px;
            height: 24px;
        }

        .error-message {
            background: rgba(233, 69, 96, 0.15);
            border: 1px solid var(--error);
            color: var(--error);
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
        }

        .error-message.hidden {
            display: none;
        }

        .footer {
            margin-top: 2rem;
            color: var(--text-secondary);
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="card">
            <h1>OBS Harness</h1>
            <p class="subtitle">Stream automation powered by AI</p>

            <div id="error-message" class="error-message hidden"></div>

            <a href="/auth/twitch" class="btn btn-twitch">
                <svg class="twitch-logo" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M11.571 4.714h1.715v5.143H11.57zm4.715 0H18v5.143h-1.714zM6 0L1.714 4.286v15.428h5.143V24l4.286-4.286h3.428L22.286 12V0zm14.571 11.143l-3.428 3.428h-3.429l-3 3v-3H6.857V1.714h13.714Z"/>
                </svg>
                Login with Twitch
            </a>

            <p class="footer">
                Only authorized broadcasters can access this application.
            </p>
        </div>
    </div>

    <script>
        // Check for error in URL params
        const params = new URLSearchParams(window.location.search);
        const error = params.get('error');

        if (error) {
            const errorEl = document.getElementById('error-message');
            const messages = {
                'not_allowed': 'Access denied. Your Twitch account is not on the whitelist. Contact the administrator to request access.',
                'token_exchange_failed': 'Failed to authenticate with Twitch. Please try again.',
                'user_fetch_failed': 'Failed to get your Twitch profile. Please try again.',
                'callback_failed': 'Authentication failed. Please try again.',
                'access_denied': 'You denied the authentication request.',
            };
            errorEl.textContent = messages[error] || `Authentication error: ${error}`;
            errorEl.classList.remove('hidden');

            // Clean URL
            history.replaceState(null, '', window.location.pathname);
        }
    </script>
</body>
</html>
